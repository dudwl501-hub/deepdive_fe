<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>

    <head>
    <style>
        .calendar {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .calendar th {
            font-size: 14px;
            padding: 12px 0;
            color: #888;
            border-bottom: 1px solid #eee;
        }

        .calendar td {
            width: calc(100% / 7);
            height: 120px;
            padding: 8px;
            vertical-align: top;
            font-size: 14px;
            position: relative;
            border-bottom: 1px solid #f0f0f0;}

        .day {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .icon {
            width: 24px;
            margin: 4px 0;
        }

        .temp {
            font-size: 12px;
        }

        .low { color: #1e73be; }
        .high { color: #d64541; }

        .rain {
            font-size: 11px;
            color: #4d90fe;
        }

        .prev-month {
            color: #ccc;
            opacity: 0.5;
        }

        .next-month {
            color: #ccc;
            opacity: 0.5;
        }

        .calendar thead th:nth-child(1) {
            color: #e74c3c;
        }

        .calendar thead th:nth-child(7) {
            color: #3498db;
        }

        .calendar tbody td:nth-child(1) {
            color: #e74c3c;
        }

        .calendar tbody td:nth-child(7) {
            color: #3498db;
        }

    </style>
    </head>

    <table class="calendar">
        <thead>
         <tr>
            <th>일</th>
            <th>월</th>
            <th>화</th>
            <th>수</th>
            <th>목</th>
            <th>금</th>
            <th>토</th>
        </tr>
        </thead>

    <tbody>
        <!-- 10월 날짜(블러 처리)-->
        <tr>
        <td class="prev-month">
            <div class="day">26</div>
            <img src="icons/rain.png" alt="rain" class="icon">
            <div class="temp"><span class="low">17°</span> / <span class="high">20°</span></div>
            <div class="rain">1mm</div>
        </td>

        </td>
        <td class="prev-month">

            <div class="temp"><span class="low">17°</span> / <span class="high">20°</span></div>

        </td>
        <td class="prev-month">

        </td>
        <td class="prev-month">

            <div class="temp"><span class="low">17°</span> / <span class="high">20°</span></div>

        <!-- 11월 시작 -->
        <td>
            <div class="day">1</div>

            <div class="temp"><span class="low">17°</span> / <span class="high">20°</span></div>
            <div class="rain">1mm</div>
        </td>
        </tr>

        <!-- 주 단위 반복 2~30일 넣을 예정-->
       <tr>
      <td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td>

    </tbody>
    </table>
    </head>
    </html>

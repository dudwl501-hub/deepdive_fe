<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
            table {
                border-spacing: 0px;
                border-collapse: collapse;
            }
            td, th {
                border: 1px solid black;
                padding: 10px;
            }
    </style>
</head>

<body>
    <table>
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
         </tr>   
         <tr>
            <td>D</td>
            <td>E</td>
            <td>F</td>
         </tr>   
    </table>
    <hr>
    <table>  
         <tr>
            <td colspan="3">A</td>
            </tr>
            <td>D</td>
            <td>E</td>
            <td>F</td>
         </tr>   
    </table>
    <hr>
    <table>
        <tr>
            <td rowspan="2">A</td>
            <td>B</td>
            <td>C</td>
         </tr>   
         <tr>
            <td>E</td>
            <td>F</td>
         </tr>   
    </table>

    <hr>
    <table>
        <tr>
            <td rowspan="3"> 
                <img src="./image/irangi_3.png" alt="">
            </td>
            <td>이름</td>
            <td>맹영지</td>
            <td>mbti</td>
            <td>intp</td>
        </tr>
        <tr>
            <th>주소</th>
            <td colspan="3">-</td>  
        </tr>
        <tr>
            <td>전화번호</td>
            <td>-</td>
            <td>생일</td>
            <td>-</td>
        </tr>
    </table>


</body>

</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>네이버 마켓</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 20px;
      background: #fafafa;
    }

    /* 상단 헤더 */
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    header h1 {
      font-size: 22px;
      color: #03c75a;
      margin: 0;
      font-weight: 800;
    }

    nav a {
      text-decoration: none;
      color: #222;
      font-size: 16px;
    }

    /* 섹션 제목 */
    h2 {
      margin-top: 40px;
      font-size: 26px;
    }

    /* 상품 카드 */
    .card {
      width: 220px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 10px;
      margin-top: 20px;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
    }

    .title a {
      text-decoration: none;
      color: #111;
      font-size: 15px;
      font-weight: 500;
      display: inline-block;
      margin: 8px 0 6px 0;
      line-height: 1.3;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }

    .won {
      font-size: 14px;
      color: #777;
    }

    
  </style>
</head>

<body>

  <!-- 상단 헤더 -->
  <header>
    <h1>NAVER OGQ마켓</h1>
    <nav>
      <a href="#">홈</a>
    </nav>
  </header>

  <!-- 인기 굿즈 -->
  <h2>인기 굿즈</h2>

  <!-- 상품 카드 -->
  <div class="card">

    <!-- 상품 이미지 클릭 → 상세페이지 -->
    <a href="product-detail.html">
      <img 
        src="./image/irangi_6.png" 
        alt="블루 아카이브 티파티 엔틱 찻잔"
      />
    </a>

    <!-- 상품명 = 작가 페이지로 이동 -->
    <div class="title">
      <a href="artist-page.html">
        블루 아카이브 티파티 엔틱 찻...
      </a>
    </div>

    <!-- 가격은 클릭해도 아무 일 없음 -->
    <div class="price">
      29,700 <span class="won">원</span>
    </div>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Document</title>
  <linkn rel="stylesheet" href="reset.css" />
  <style>

    div.card {
        width: 450px;
        padding: 30px;
        border: 10px solid gold;
        border-radius: 10px;
        font-family: Arial, sans-serif;
    }

    background {
        background-color: #f9f9f9;
    }

    .card{
        box-sizing: border-box;
        width: 300px;
        border:5px solid #999;
        border-radius: 10px;
        padding: 30px 20px;
        margin: 50px  0 0 50px;
        background-color: fff;
        background-image: url('./image/icons/lab_bk.svg');
        background-image: url('./image/irangi_2.png');
        background-position: right 10px top 10px, right 10px bottom 10px;
        background-repeat: no-repeat;
    }

    .card h1{
        font-size: 24px;
        font-weight: 600;
        padding-left: 34px;
        background-image: url('./image/icons/cafe.svg');
        background-repeat: no-repeat;
    }

    .card p {
        font-size: 14px;
        line-height: 1.2;
        margin-top: 14px;
        padding-right: 50px;
    }
  </style>
</head>

<body>

    <div class="card">
    <h1>Card Title</h1>
    <p>이 카드는 CSS Box Model을 이해하기 위한 예입니다.</p>
    <p>margin, padding, border, border-radius, 크기 등을 다양하게 조정해보세요</p>
  </div>

</body>
</html>

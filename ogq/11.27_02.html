<!DOCTYPE html>
<html lang="">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochi Market</title>
    </head>

    <style>
        
        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(120deg, #fcd2e2, #c4eff9);
            color: #222;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 공통 레이아웃 */
        .page {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 헤더 */
        header {
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0 12px;
            background-color: #fff;
            width: 100%;
            position : relative;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            padding: 0;
            box-shadow: none;

        }

        .logo-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: #ff6f91;
        }

        /* 검색 */
        .search-area {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 0 40px;
        }

        .search-box {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            background: #fff;
            outline-color: #777;
            border-radius: 999px;
            padding: 10px 18px;
            border: 1px solid #d5d5d5;
        }

        .search-box input ::placeholder {
            color: #bbb;
        }

        .search-box input {
            font-size: 14px;
            flex: 1;
            border: none;
            outline: none;
            font-sizee: 14px;
        }

        .search-icon {
            font-size: 18px;
            color: #888;
        }

        /* 네비게이션 + 로그인 */
        .nav-area {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 15px;
        }

        .nav-links a {
            margin-right: 14px;
            color: #777;
            position: relative;
        }

        .nav-links a {
            margin-right: 14px;
            color:#777;
            position: relative;
        }

        .nav-links a:hover {
            color: #ff6f91;
        }

        .nav-links a.active {
            color: #ff6f91;
        }

      .nav-links a.active::after {
          content: '';
          position: absolute;
          left: 0;
          bottom: -4px;
          width: 100%;
          height: 2px;
          background-color: #ff6f91;
        }

      .btn-login {
        padding: 8px 18px;
        border-radius:999px;
        border: none;
        background: #a6f4c5;
        color: #167c4b;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(166, 244, 197, 0.6);
        transition: transform 0.1s ease, box-shadow 0.15s ease, filter 0.1s ease;
      }  

      .btn-login:hover {
        filter: brightness(1.03);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(166, 244, 197, 0.7);
      }

      /* 히어로 섹션 */
      .hero {
        margin-top: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
        min-height: 420px;
      }

      .hero-text {
        flex: 1px;
        max-width: 520px;
        font-weight: 800;
        color: #333;
        margin-bottom: 16px;
      }

      .hero-desc {
        font-size: 15px;
        color: #666;
        margin-bottom: 32px;
        line-height: 1.6;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-width: 200px;
        height: 54px;

        cursor: pointer;
        border: none;

        padding: 0 28px;
        border-radius: 999px;
       
        background: linear-gradient(135deg, #ff8fbe, #ff6f91);
        color: #fff;

        font-size: 15px;
        font-weight: 700;
       
        box-shadow: 0 12px 30px rgba(255, 111, 145, 0.5);
      }

      .btn-primary:hover {
        filter: brightness(1.03);
        transform: translateY(-2px);
        box-shadow: 0 16px 40px rgba(255, 111, 179, 0.45)
      }

      /* 히어로 이미지 카드 */
      .hero-image-wrap {
        flex: 1;
        display: flex;
        justify-content;
      }

       .hero-card {
        width: 380px;
        height: 360px;
        background: #fff;
        border-radius: 32px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
      }

       .hero-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .hero-text {
        max-width: none;
      }

      .hero-title {
        font-size: 30px;
      }

      .hero-desc {
        font-size: 17px;
      }

      .hero-image-wrap {
        width: 100%;
      }

      header::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100vw;          /* 화면 전체 너비 */
            height: 100%;
            background: #fff;
            z-index: -1;           /* header 내용 뒤로 보내기 */
        }


        

    </style>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Mochi Market</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: linear-gradient(120deg, #ffeaf2, #e6f7fb);
      color: #222;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* 공통 레이아웃 */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px 80px;
    }

    /* 헤더 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ff8fb3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 4px 10px rgba(255, 143, 179, 0.5);
    }

    .logo-text {
      font-size: 20px;
      font-weight: 800;
      color: #ff6f91;
    }

    /* 검색창 */
    .search-area {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0 40px;
    }

    .search-box {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 999px;
      padding: 10px 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #bbb;
    }

    .search-icon {
      font-size: 18px;
      color: #888;
    }

    /* 네비게이션 */
    .nav-area {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 15px;
    }

    .nav-links a {
      margin-right: 14px;
      color: #777;
      position: relative;
    }

    .nav-links a:hover {
      color: #ff6f91;
    }

    .nav-links a.active {
      color: #ff6f91;
      font-weight: 600;
    }

    .nav-links a.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 2px;
      border-radius: 999px;
      background: #ff6f91;
    }

    .btn-login {
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: #a6f4c5;
      color: #167c4b;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(166, 244, 197, 0.6);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
    }

    .btn-login:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(166, 244, 197, 0.7);
    }

    /* 히어로 섹션 */
    .hero {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      min-height: 420px;
    }

    .hero-text {
      flex: 1;
      max-width: 520px;
    }

    .hero-title {
      font-size: 40px;
      line-height: 1.3;
      font-weight: 800;
      color: #333;
      margin-bottom: 16px;
    }

    .hero-desc {
      font-size: 15px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ff8fb3, #ff6f91);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(255, 111, 145, 0.5);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.03);
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(255, 111, 145, 0.55);
    }

    /* 히어로 이미지 카드 */
    .hero-image-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .hero-card {
      width: 380px;
      height: 360px;
      background: #fff;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 반응형 */
    @media (max-width: 900px) {
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .search-area {
        order: 3;
        padding: 0;
      }

      .nav-area {
        justify-content: space-between;
      }

      .hero {
        flex-direction: column-reverse;
        text-align: center;
      }

      .hero-text {
        max-width: none;
      }

      .hero-title {
        font-size: 32px;
      }

      .hero-desc {
        font-size: 14px;
      }

      .hero-image-wrap {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- 헤더 -->
    <header>
      <!-- 로고 -->
      <div class="logo-area">
        <div class="logo-icon">🍡</div>
        <div class="logo-text">Mochi Market</div>
      </div>

      <!-- 검색 -->
      <div class="search-area">
        <form class="search-box">
          <input type="text" placeholder="귀여운 이모티콘을 찾아보세요!" />
          <span class="search-icon">🔍</span>
        </form>
      </div>

      <!-- 메뉴 + 로그인 -->
      <div class="nav-area">
        <nav class="nav-links">
          <a href="#" class="active">홈</a>
          <a href="#">인기</a>
          <a href="#">신규</a>
        </nav>
        <button class="btn-login">로그인</button>
      </div>
    </header>

    <!-- 히어로 섹션 -->
    <section class="hero">
      <!-- 왼쪽 텍스트 -->
      <div class="hero-text">
        <h1 class="hero-title">
          당신의 대화를<br />
          더 귀엽게 만들어보세요!
        </h1>
        <p class="hero-desc">
          매일매일 새로운 작가님들의<br />
          반짝이는 아이디어를 만나보세요.
        </p>
        <button class="btn-primary">인기 이모티콘 보러가기</button>
      </div>

      <!-- 오른쪽 이미지 카드 -->
      <div class="hero-image-wrap">
        <div class="hero-card">
          <!-- 여기 이미지를 너 파일로 교체하면 됨 -->
          <img src="hero-image.png" alt="귀여운 이모티콘 캐릭터 이미지" />
        </div>
      </div>
    </section>

  </div>
</body>
</html>

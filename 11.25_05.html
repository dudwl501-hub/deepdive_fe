<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navercorp</title>
</head>

<style>
    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background: #fff;
        color: #111;
    }

    .page {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
    }

    h1 {
        font-size: 36px;
        font-weight: 700;
        margin-bottom: 24px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        text-align: left;
        padding: 20px 0;
        border-bottom: 1px solid #e5e5e5;
    }

    th {
        font-size: 16px;
        font-weight: 600;
    }

    td {
        font-size: 14px;
        font-weight: 400;
    }

    tbody tr:hover {
        background: #fafafa;
         cursor: pointer;
        border: none;
    }

    .view-btn {
        background: #111217;
        color: #fff;
        font-size:16px;
        padding: 14px 32px;
        border-radius:50px;
        cursor: pointer;
        border: none;
    }


    .view-btn:hover {
        opacity: 0.9;
    }

    .btn-wrapper {
        text-align: center;
        margin-top: 40px;
    }


</style>

<body>
    <div class="page">
        <h1>AGM/EGM Schedule</h1>
    </div>

    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Date</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <th>26th Annual Shareholder's Meting</th>
            <td>2025.02.10</td>
        </tr>
        <tr>
            <th>25th Annual Shareholder's Meting</th>
            <td>2024.02.26</td>
        </tr>
        <tr>
            <th>24th Annual Shareholder's Meting</th>
            <td>2023.03.22</td>
        </tr>
        <tr>
            <th>23th Annual Shareholder's Meting</th>
            <td>2022.03.14</td>
        </tr>
        </tbody>
    </table>

    <div class="btn-wrapper">
        <button class="view-btn">View all AGM/Egm</button>
    </div>
</body>


</html>

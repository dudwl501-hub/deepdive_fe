<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    </head>

    <body>
        <input type="color" id="selet-color">
        <button type="button" id="btn">컬러값 출력</button>
        <p id ="msg"></p>

        <script>
            //구현 : 버튼을 클릭하면, 선택한 컬러값이 p태그에 출력되게 하세요.
            //input type=color에서 선택한 값은 Hex 값으로 돌아온다.

            //구현 2 : 컬러를 변경하면, 문서의 배경색이 바뀌도록 하세요.
            const colorInput = document.getElemetById('select-color')
            const btn = document.getElemetById('btn')
            const msg = document.getElemetById('msg')

           // event
           btn.addEventListener('click', showColor)

            //features
            function showColor() {
                msg.textContent = colorInput.value;
            }

            function changeColor() {
                body.style.backgroundColor = colorInput.value;
            }

            </script>
            </body>
            </html>
